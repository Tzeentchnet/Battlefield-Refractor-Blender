name: Build Packages

on:
  push:
    branches:
      - main

jobs:
  package:
    name: Package add-on
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create Zip Archive (Contents Only)
        id: create_zip
        run: |
          ZIP_NAME="io_scene_bf2-${{ github.sha }}.zip"

          cd io_scene_bf2
          zip -r "../$ZIP_NAME" . -x "*.git*" "*__pycache__*"
          cd ..

          echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT

      - name: Upload Packaged Zip as Artifact
        uses: actions/upload-artifact@v7
        with:
          name: io_scene_bf2
          path: ${{ steps.create_zip.outputs.zip_name }}
          archive: false
          if-no-files-found: error
